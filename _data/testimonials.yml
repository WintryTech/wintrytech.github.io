- name: Dilhara Wickramasinghe, Software Developer Intern, Wintry Tech AS
  comment: My six-month internship at Wintry Tech AS gave me hands-on experience working on an in-house project using .NET/C#. With a BSc and MSc academic background in Cybersecurity and Information Systems, this role helped me strengthen my back-end development skills, problem-solving, teamwork, and understanding of real-world software development. I also really appreciated the welcoming and supportive work culture, which made it easy to learn, ask questions, and grow throughout the internship.
  image: /assets/images/dilharaw.jpg